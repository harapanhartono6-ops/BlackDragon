name: BlackDragon Kernel CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackdragon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RMX2061 Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip

      - name: Check build files
        run: |
          test -f build.sh || {
            echo "::error::build.sh tidak ditemukan di root repository"
            exit 1
          }

          test -f arch/arm64/configs/atoll_defconfig || {
            echo "::error::atoll_defconfig tidak ditemukan"
            exit 1
          }

          chmod +x build.sh

      - name: Build kernel
        run: |
          set -o pipefail
          bash ./build.sh 2>&1 | tee build.log

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts

          if [ -d "$HOME/AnyKernel3" ]; then
            find "$HOME/AnyKernel3" -maxdepth 1 -type f -name "*.zip" \
              -exec cp -v {} artifacts/ \;
          fi

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp -v out/arch/arm64/boot/Image.gz-dtb artifacts/
          fi

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp -v out/arch/arm64/boot/Image artifacts/
          fi

          cp -f build.log artifacts/ 2>/dev/null || true

          echo "===== Daftar artifact ====="
          ls -lah artifacts/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackDragon-RMX2061-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Send ZIP to Telegram
        if: always() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets belum dikonfigurasi. Melewati pengiriman."
            exit 0
          fi

          shopt -s nullglob
          zips=(artifacts/*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ada ZIP untuk dikirim."
            exit 0
          fi

          for file in "${zips[@]}"; do
            curl --fail --silent --show-error \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${file}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          done
